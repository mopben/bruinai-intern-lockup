[project]
name = "dryrun-vision"
version = "0.1.0"
description = "Dry Run vision pipeline: filmed video to positions.jsonl and actions.jsonl."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# Detector, tracker and action labeller. Large; installed by the ML stages only.
ml = [
    "torch",
    "torchvision",
    "transformers",
    "opencv-python-headless",
    "pillow",
    "supervision",
    "rfdetr",
    "trackers==2.1.0",
]
gemini = [
    "google-genai",
]

[project.scripts]
dryrun-vision = "dryrun_vision.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dryrun_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["dryrun_vision"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "T20", "C90", "ANN"]
ignore = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "T20"]
"src/dryrun_vision/cli.py" = ["T20"]
"src/dryrun_vision/commands/**" = ["T20"]
