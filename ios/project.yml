# Generate the Xcode project with:  cd ios && xcodegen generate
# The generated DryRunScan.xcodeproj is committed so a teammate can just open it.
name: DryRunScan
options:
  bundleIdPrefix: com.dryrun
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your own team here (or in Xcode: target > Signing & Capabilities > Team).
    DEVELOPMENT_TEAM: ""
targets:
  DryRunScan:
    type: application
    platform: iOS
    sources:
      - path: DryRunScan
        excludes:
          - Info.plist
    info:
      path: DryRunScan/Info.plist
      properties:
        CFBundleDisplayName: Dry Run Scan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: Dry Run uses the camera and LiDAR to scan the counter into boxes.
        NSLocalNetworkUsageDescription: Dry Run sends the finished scan to the laptop running the stage app on this network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dryrun.scan
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
  DryRunScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DryRunScanTests
    dependencies:
      - target: DryRunScan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dryrun.scan.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DryRunScan.app/DryRunScan"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DryRunScan:
    build:
      targets:
        DryRunScan: all
        DryRunScanTests: [test]
    test:
      targets:
        - DryRunScanTests
